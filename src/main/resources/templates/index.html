<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnipURL — Fast URL Shortener</title>
    <meta name="description" content="Generate lightning-fast short links with real-time analytics" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0a0f1e;
            --card-gradient: linear-gradient(145deg, #1e1b4b, #0f172a);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --input-bg: #1e293b;
            --input-border: #334155;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --error-color: #ef4444;
            --success-color: #10b981;
            --radius-card: 16px;
            --radius-btn: 10px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background Accents */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.28;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #3b82f6, transparent 70%);
            top: -100px;
            left: -100px;
        }
        body::after {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #8b5cf6, transparent 70%);
            bottom: -100px;
            right: -100px;
        }

        /* ── Top Navbar ─────────────────────────────────── */
        .navbar {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .navbar-logo {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: -0.02em;
        }

        .navbar-link {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .navbar-link:hover {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateX(3px);
        }

        /* ── Main Container ─────────────────────────────── */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── Hero Section ───────────────────────────────── */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 0.65rem;
            background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-dim);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* ── Glassmorphism Card ─────────────────────────── */
        .card {
            width: 100%;
            max-width: 600px;
            background: var(--card-gradient);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.25rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        /* ── Form Styles ────────────────────────────────── */
        .form-group {
            margin-bottom: 1.35rem;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-btn);
            color: var(--text-main);
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .form-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .char-counter {
            font-size: 0.78rem;
            margin-top: 0.4rem;
            color: var(--text-dim);
            transition: color 0.2s ease;
            text-align: right;
            font-weight: 500;
        }

        .char-counter.error {
            color: var(--error-color);
            font-weight: 600;
        }

        /* Custom Date-Time Picker Component */
        .dt-picker {
            position: relative;
            width: 100%;
        }

        .dt-trigger {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-btn);
            color: #64748b;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dt-trigger.has-value {
            color: var(--text-main);
        }

        .dt-trigger:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .dt-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #1e1b4b;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-btn);
            padding: 1rem;
            z-index: 20;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .dt-dropdown.open {
            display: block;
        }

        .dt-dropdown label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
        }

        .dt-dropdown input {
            width: 100%;
            padding: 8px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            margin-bottom: 0.75rem;
        }

        .dt-actions {
            display: flex;
            gap: 0.5rem;
        }

        .dt-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .dt-clear-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
        }
        .dt-clear-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
        }

        .dt-done-btn {
            background: var(--accent-blue);
            color: #fff;
        }
        .dt-done-btn:hover {
            background: #2563eb;
        }

        /* ── Submit Button ──────────────────────────────── */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35);
        }

        .btn-submit:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 26px rgba(139, 92, 246, 0.45);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* ── Result Card ────────────────────────────────── */
        .result-card {
            margin-top: 1.75rem;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: var(--radius-btn);
            padding: 1.5rem;
            animation: fadeIn 0.35s ease;
        }

        .result-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #34d399;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .result-input-group {
            display: flex;
            gap: 0.65rem;
            margin-bottom: 0.85rem;
        }

        .result-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: var(--radius-btn);
            color: #6ee7b7;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            outline: none;
        }

        .btn-copy {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s ease, background 0.2s;
        }

        .btn-copy:hover {
            transform: scale(1.03);
        }

        .btn-stats {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: #c084fc;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-stats:hover {
            color: #e9d5ff;
            text-decoration: underline;
        }

        .result-meta {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-top: 0.5rem;
            word-break: break-all;
        }

        /* ── Error Card ─────────────────────────────────── */
        .error-card {
            margin-top: 1.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: var(--radius-btn);
            padding: 1rem 1.25rem;
            color: #fca5a5;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            animation: fadeIn 0.35s ease;
        }

        /* ── Footer ─────────────────────────────────────── */
        .footer {
            position: relative;
            z-index: 10;
            width: 100%;
            text-align: center;
            padding: 2rem 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-dim);
            font-size: 0.88rem;
        }

        .footer-tech {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 0.35rem;
            letter-spacing: 0.02em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .navbar {
                padding: 1rem 1.25rem;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .card {
                padding: 1.5rem;
            }
            .result-input-group {
                flex-direction: column;
            }
            .btn-copy {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Top Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-logo">⚡ SnipURL</a>
        <a href="/stats/all" class="navbar-link" id="navAnalyticsLink" onclick="goToStats(event)">Analytics →</a>
    </nav>

    <!-- Main Container -->
    <main class="container">
        <!-- Hero Section -->
        <header class="hero">
            <h1>Shorten. Share. Track.</h1>
            <p>Generate lightning-fast short links with real-time analytics</p>
        </header>

        <!-- Main Glass Card Form -->
        <div class="card">
            <form th:action="@{/shorten}" method="post" th:object="${urlRequest}" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="longUrl">Destination URL</label>
                    <input type="url" id="longUrl" class="form-input" th:field="*{longUrl}"
                           placeholder="Paste your long URL here..." required="required" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="customAlias">Custom Alias</label>
                    <input type="text" id="customAlias" class="form-input" th:field="*{customAlias}"
                           placeholder="Custom alias (optional, max 8 chars)" maxlength="20" />
                    <div id="aliasCounter" class="char-counter">0 / 8 characters</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Expiration Date</label>
                    <div class="dt-picker" id="dtPicker">
                        <input type="hidden" id="expirationTime" th:field="*{expirationTime}" />
                        <button type="button" class="dt-trigger" id="dtTrigger" onclick="togglePicker()">
                            <span id="dtTriggerText">Set expiry date (optional)</span>
                            <span>📅</span>
                        </button>
                        <div class="dt-dropdown" id="dtDropdown">
                            <label for="dtDate">Date</label>
                            <input type="date" id="dtDate" />
                            <label for="dtTime">Time</label>
                            <input type="time" id="dtTime" value="23:59" />
                            <div class="dt-actions">
                                <button type="button" class="dt-clear-btn" onclick="clearPicker()">Clear</button>
                                <button type="button" class="dt-done-btn" onclick="donePicker()">Done</button>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Generate Short Link →</button>
            </form>

            <!-- Result Card -->
            <div class="result-card" th:if="${result}">
                <div class="result-title">✅ Your link is ready!</div>
                <div class="result-input-group">
                    <input type="text" id="shortUrlResult" class="result-input" th:value="${result.shortUrl}" readonly="readonly" />
                    <button type="button" id="copyBtn" class="btn-copy" onclick="copyShortUrl()">Copy Link</button>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                    <div class="result-meta">
                        Original: <span th:text="${result.longUrl}"></span>
                    </div>
                    <a th:if="${statsUrl}" th:href="${statsUrl}" class="btn-stats">View Analytics ↗</a>
                </div>
                <div class="result-meta" th:if="${result.expirationTime}">
                    Expires: <span th:text="${result.expirationTime}"></span>
                </div>
            </div>

            <!-- Error Card -->
            <div class="error-card" th:if="${error}">
                <span>❌</span>
                <span th:text="${error}"></span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div>Built by Ishank Aggarwal · SnipURL · 2026</div>
        <div class="footer-tech">Java · Spring Boot · Kafka · Redis · PostgreSQL</div>
    </footer>

    <!-- Vanilla JavaScript -->
    <script>
        // Character counter for custom alias input
        (function () {
            var aliasInput = document.getElementById('customAlias');
            var counter = document.getElementById('aliasCounter');
            if (aliasInput && counter) {
                function updateCounter() {
                    var len = aliasInput.value.length;
                    counter.textContent = len + " / 8 characters";
                    if (len > 8) {
                        counter.classList.add('error');
                    } else {
                        counter.classList.remove('error');
                    }
                }
                aliasInput.addEventListener('keyup', updateCounter);
                aliasInput.addEventListener('input', updateCounter);
                updateCounter();
            }
        })();

        // Clipboard copy functionality
        function copyShortUrl() {
            var input = document.getElementById('shortUrlResult');
            var btn = document.getElementById('copyBtn');
            if (!input || !btn) return;

            navigator.clipboard.writeText(input.value).then(function () {
                btn.textContent = "Copied! ✓";
                setTimeout(function () {
                    btn.textContent = "Copy Link";
                }, 2000);
            }).catch(function () {
                input.select();
                document.execCommand('copy');
                btn.textContent = "Copied! ✓";
                setTimeout(function () {
                    btn.textContent = "Copy Link";
                }, 2000);
            });
        }

        // Navigation to stats (prompt if clicking general link without specific code)
        function goToStats(e) {
            var currentResult = document.getElementById('shortUrlResult');
            if (currentResult && currentResult.value) {
                e.preventDefault();
                var parts = currentResult.value.split('/');
                window.location.href = '/stats/' + parts[parts.length - 1];
            } else {
                e.preventDefault();
                var code = prompt('Enter short code to view analytics:');
                if (code && code.trim()) {
                    var trimmed = code.trim();
                    if (trimmed.includes('/')) {
                        var p = trimmed.split('/');
                        trimmed = p[p.length - 1];
                    }
                    window.location.href = '/stats/' + trimmed;
                }
            }
        }

        // Datetime picker dropdown controls
        function togglePicker() {
            document.getElementById('dtDropdown').classList.toggle('open');
        }

        function donePicker() {
            var d = document.getElementById('dtDate').value;
            var t = document.getElementById('dtTime').value || '23:59';
            var hidden = document.getElementById('expirationTime');
            var triggerText = document.getElementById('dtTriggerText');
            var trigger = document.getElementById('dtTrigger');

            if (d) {
                hidden.value = d + 'T' + t;
                triggerText.textContent = d + ' ' + t;
                trigger.classList.add('has-value');
            }
            document.getElementById('dtDropdown').classList.remove('open');
        }

        function clearPicker() {
            document.getElementById('dtDate').value = '';
            document.getElementById('dtTime').value = '23:59';
            document.getElementById('expirationTime').value = '';
            var triggerText = document.getElementById('dtTriggerText');
            var trigger = document.getElementById('dtTrigger');
            triggerText.textContent = 'Set expiry date (optional)';
            trigger.classList.remove('has-value');
            document.getElementById('dtDropdown').classList.remove('open');
        }

        document.addEventListener('click', function (e) {
            var picker = document.getElementById('dtPicker');
            if (picker && !picker.contains(e.target)) {
                var dropdown = document.getElementById('dtDropdown');
                if (dropdown) dropdown.classList.remove('open');
            }
        });

        // Initialize picker if hidden input is already populated
        (function () {
            var val = document.getElementById('expirationTime').value;
            if (val) {
                var parts = val.split('T');
                document.getElementById('dtDate').value = parts[0];
                if (parts[1]) document.getElementById('dtTime').value = parts[1].substring(0, 5);
                var triggerText = document.getElementById('dtTriggerText');
                triggerText.textContent = parts[0] + ' ' + (parts[1] ? parts[1].substring(0, 5) : '23:59');
                document.getElementById('dtTrigger').classList.add('has-value');
            }
        })();
    </script>
</body>
</html>
